<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBite AI - Food Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        #camera-container {
            margin-bottom: 20px;
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background-color: #000;
        }
        video {
            display: block;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #218838;
        }
        #result-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #captured-image {
            border: 4px solid #28a745;
            border-radius: 10px;
            margin-top: 10px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>SafeBite AI Scanner</h1>

    <div id="camera-container">
        <video id="camera-feed" width="320" height="240" autoplay playsinline></video>
    </div>

    <button id="scan-btn">📸 Scan Food</button>

    <canvas id="snapshot" width="320" height="240" style="display:none;"></canvas>

    <div id="result-container">
        <p id="status-text" style="display: none; font-weight: bold; color: #555;">Captured Image:</p>
        <img id="captured-image" src="" alt="Captured Food" style="display:none;"/>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('snapshot');
        const context = canvas.getContext('2d');
        const scanBtn = document.getElementById('scan-btn');
        const capturedImage = document.getElementById('captured-image');
        const statusText = document.getElementById('status-text');

        // 1. Request access to the user's camera
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" } // Prefer back camera on phones
        })
        .then((stream) => {
            // Connect the live stream to the video element
            video.srcObject = stream;
        })
        .catch((err) => {
            console.error("Oops! Can't access the camera.", err);
            alert("Please allow camera access to scan food.");
        });

        // 2. Take a picture when the button is clicked
        scanBtn.addEventListener('click', () => {
            // Ensure the video is ready before capturing
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Draw the current video frame onto the canvas
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Convert the canvas picture into a Base64 image string
                const imageDataURL = canvas.toDataURL('image/jpeg');
                
                // Show the captured image on the screen
                capturedImage.src = imageDataURL;
                capturedImage.style.display = "block";
                statusText.style.display = "block";
                
                console.log("Food scanned! Base64 image data ready to be sent to the AI.");
                // NOTE: imageDataURL is the string you will send to your AI backend!
            }
        });
    </script>

</body>
</html>
